name: BackupApp

options:
  bundleIdPrefix: com.quseqi.backup
  deploymentTarget:
    iOS: "16.0"

targets:
  BackupApp:
    type: application
    platform: iOS
    entitlements:
      path: App/BackupApp.entitlements
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: ShareExtension
    settings:
      GENERATE_INFOPLIST_FILE: "YES"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
      INFOPLIST_KEY_CFBundleDisplayName: "备份助手"
      INFOPLIST_KEY_UIFileSharingEnabled: "YES"
      INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: "YES"
    info:
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.quseqi.backup.url
            CFBundleURLSchemes:
              - backupapp

  # v8.0：分享扩展，打zip后直接调系统分享存iCloud，不依赖App Group
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: App/ShareExtension
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: App/Sources/ZipHelper.swift
      # v25: 纯 Swift Deflate 解码器（SWCompression，MIT）
      - path: App/Sources/Deflate.swift
      - path: App/Sources/Deflate+Constants.swift
      - path: App/Sources/Deflate+Lengths.swift
      - path: App/Sources/DeflateError.swift
      - path: App/Sources/DecompressionAlgorithm.swift
      - path: App/Sources/BitReader.swift
      - path: App/Sources/LsbBitReader.swift
      - path: App/Sources/ByteReader.swift
      - path: App/Sources/SignedNumberRepresentation.swift
      - path: App/Sources/Code.swift
      - path: App/Sources/CodeLength.swift
      - path: App/Sources/DecodingTree.swift
      - path: App/Sources/SWCExtensions.swift
      - path: App/Sources/BitByteDataExtensions.swift
    entitlements:
      path: App/ShareExtension/ShareExtension.entitlements
    settings:
      GENERATE_INFOPLIST_FILE: "NO"
      INFOPLIST_FILE: "App/ShareExtension/Info.plist"
      PRODUCT_BUNDLE_IDENTIFIER: "com.quseqi.backup.BackupApp.ShareExtension"
