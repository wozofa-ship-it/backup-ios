name: BackupApp

options:
  bundleIdPrefix: com.quseqi.backup
  deploymentTarget:
    iOS: "15.0"

targets:
  BackupApp:
    type: application
    platform: iOS
    entitlements:
      path: App/BackupApp.entitlements
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: ShareExtension
    settings:
      GENERATE_INFOPLIST_FILE: "YES"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
      INFOPLIST_KEY_CFBundleDisplayName: "备份助手"
      INFOPLIST_KEY_UIFileSharingEnabled: "YES"
      INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: "YES"

  # v7.0：分享扩展，让"备份助手"出现在系统分享菜单中
  ShareExtension:
    type: app-extension
    platform: iOS
    bundleId: com.quseqi.backup.BackupApp.ShareExtension
    sources:
      - path: App/ShareExtension
        excludes:
          - Info.plist
          - "*.entitlements"
    info:
      path: App/ShareExtension/Info.plist
    entitlements:
      path: App/ShareExtension/ShareExtension.entitlements
    settings:
      GENERATE_INFOPLIST_FILE: "NO"
